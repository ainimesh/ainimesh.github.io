name: Deploy static site to GitHub Pages

# Deploys the plain HTML/CSS site (no Jekyll build) to GitHub Pages.
# One-time setup: Repo → Settings → Pages → Build and deployment →
#   Source = "GitHub Actions".

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; cancel in-progress runs on new pushes.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Try to switch the Pages source to "GitHub Actions" automatically.
          # If this can't change it, set it manually:
          #   Settings → Pages → Build and deployment → Source = "GitHub Actions".
          enablement: true

      # Rewrites  style.css?v=… / site.js?v=… / data.js?v=…  in every .html to the
      # commit SHA, so a content change always produces a new URL and browsers
      # fetch it immediately. You never need to bump ?v=N by hand.
      - name: Stamp asset versions (cache-busting)
        run: |
          python3 - <<'PY'
          import os, re, pathlib
          sha = os.environ["GITHUB_SHA"][:8]
          pat = re.compile(r"(style\.css|site\.js|data\.js)\?v=[^\"']*")
          n = 0
          for p in sorted(pathlib.Path(".").rglob("*.html")):
              if ".git" in p.parts:
                  continue
              t = p.read_text(encoding="utf-8")
              new = pat.sub(lambda m: m.group(1) + "?v=" + sha, t)
              if new != t:
                  p.write_text(new, encoding="utf-8")
                  n += 1
          print(f"Stamped {n} HTML file(s) with version {sha}")
          PY

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
